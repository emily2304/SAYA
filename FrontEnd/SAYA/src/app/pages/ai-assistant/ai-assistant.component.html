<div class="ai-assistant-container">
  <!-- Shared sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main chat area -->
  <div class="chat-container">
    <div class="chat-header">
      <h2><i class="bi bi-robot"></i> Asistente de IA</h2>
      <p class=>SayA - tu asistente de inteligencia artificial</p>
    </div>

    <div class="chat-messages">
      <div *ngFor="let message of messages" [class.user-message]="message.sender === 'user'"
           [class.ai-message]="message.sender === 'ai'" class="message">
        <div class="message-content">
          <div class="message-sender">
            <i class="bi" [class.bi-person-fill]="message.sender === 'user'"
               [class.bi-robot]="message.sender === 'ai'"></i>
            {{message.sender === 'user' ? 'You' : 'SayA'}}
          </div>
          <div class="message-text">{{message.text}}</div>
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" [(ngModel)]="newMessage" placeholder="Type your message..."
             (keyup.enter)="sendMessage()" class="form-control">
      <button (click)="sendMessage()" class="btn btn-primary">
        <i class="bi bi-send-fill"></i> Enviar
      </button>
    </div>
  </div>
</div>
