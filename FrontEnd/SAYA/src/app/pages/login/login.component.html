<div class="login-container">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="app-title">
      <span class="text-warning">Transcriptor</span>
      <span class="text-primary">SayA</span>
    </h1>
  </header>

  <div class="login-box mx-auto">
    <h2 class="text-center mb-3">Iniciar sesión</h2>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="alert alert-danger text-center" role="alert">
      {{ errorMessage }}
    </div>

    <!-- Formulario de login -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group mb-3">
        <label for="email">Correo electronico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control bg-dark text-white border-primary"
          placeholder="Ingrese su correo electronico"
          autocomplete="username"
        />
        <div
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          class="text-danger mt-1 small"
        >
          <div *ngIf="loginForm.get('email')?.errors?.['required']">
            El email es requerido.
          </div>
          <div *ngIf="loginForm.get('email')?.errors?.['email']">
            Formato de email inválido.
          </div>
        </div>
      </div>

      <div class="form-group mb-4 password-input">
        <label for="password">Contraseña</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="form-control bg-dark text-white border-primary"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          />
          <button
            class="btn btn-outline-primary"
            type="button"
            (click)="togglePasswordVisibility()"
          >
            <i class="bi" [class.bi-eye]="showPassword" [class.bi-eye-slash]="!showPassword"></i>
          </button>
        </div>
        <div
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          class="text-danger mt-1 small"
        >
          <div *ngIf="loginForm.get('password')?.errors?.['required']">
            La contraseña es requerida.
          </div>
          <div *ngIf="loginForm.get('password')?.errors?.['minlength']">
            Debe tener al menos 6 caracteres.
          </div>
        </div>
      </div>

      <div class="text-center">
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="btn btn-primary custom-btn w-100 mb-3"
        >
          Inicia Sesión
        </button>
        <button type="button" (click)="goToRegister()" class="btn btn-outline-light">
          Crear cuenta
        </button>
      </div>
    </form>
  </div>
</div>
