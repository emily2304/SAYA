<div class="register-container">
  <header class="d-flex justify-content-center mb-4">
    <h1 class="app-title">
      <span class="text-warning">Transcriptor</span> <span class="text-primary">SayA</span>
    </h1>
  </header>

  <div class="register-box mx-auto">
    <h2 class="text-center mb-4">Crear Cuenta</h2>

    <form (ngSubmit)="onSubmit()" *ngIf="!isLoading; else loading">
      <div class="alert alert-danger" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <div class="form-group mb-3">
        <label for="name" class="form-label">Nombre Completo</label>
        <input [(ngModel)]="nombre" name="nombre" type="text" id="name"
               class="form-control bg-dark text-white border-primary"
               placeholder="Ingresa tu nombre completo" required>
      </div>

      <div class="form-group mb-3">
        <label for="email" class="form-label">Dirección de Correo Electrónico</label>
        <input [(ngModel)]="email" name="email" type="email" id="email"
               class="form-control bg-dark text-white border-primary"
               placeholder="Ingresa tu correo electrónico" required>
      </div>

      <div class="form-group mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input [(ngModel)]="password" name="password" type="password" id="password"
               class="form-control bg-dark text-white border-primary"
               placeholder="Crea una contraseña" required>
      </div>

      <div class="form-group mb-4">
        <label for="role" class="form-label">Soy un:</label>
        <select [(ngModel)]="rol" name="rol" id="role"
                class="form-control bg-dark text-white border-primary">
          <option value="student">Estudiante</option>
          <option value="teacher">Profesor</option>
        </select>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary custom-btn w-100 mb-3">
          Registrarse
        </button>
      </div>
    </form>

    <ng-template #loading>
      <div class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3">Creando tu cuenta...</p>
      </div>
    </ng-template>
  </div>
</div>
